# TRADING ENABLED CONFIGURATION
# Removes overprotective mechanisms while maintaining 1 trade per market

market_strategies:
  "DAX":
    # RSI settings - more permissive
    rsi_period: 14
    rsi_buy_threshold: 50        # More moderate thresholds
    rsi_sell_threshold: 50       # More moderate thresholds
    stop_loss_pips: 20           # Reasonable stops
    take_profit_pips: 30         # Achievable targets
    min_confidence_threshold: 0.1  # Very low to allow trading
    
    # DISABLE emergency protection
    emergency_protection:
      max_consecutive_losses: 999     # Effectively disabled
      daily_loss_limit: 99999         # Effectively disabled
      cooling_off_hours: 0            # No cooling off
      reduce_position_size: 1.0       # Always full size
    
    # No time restrictions
    trading_hours:
      avoid_hours: []
      preferred_hours: []
      
    # No volatility filter
    max_atr_multiplier: 999.0        # Effectively disabled
    volatility_lookback: 14

  "FTSE 100":
    # RSI settings - more permissive
    rsi_period: 14
    rsi_buy_threshold: 50        # More moderate
    rsi_sell_threshold: 50       # More moderate  
    stop_loss_pips: 15           # Reasonable
    take_profit_pips: 25         # Achievable
    min_confidence_threshold: 0.1  # Very low to allow trading
    
    # DISABLE emergency protection
    emergency_protection:
      max_consecutive_losses: 999     # Effectively disabled
      daily_loss_limit: 99999         # Effectively disabled
      cooling_off_hours: 0            # No cooling off
      reduce_position_size: 1.0       # Always full size
    
    # No time restrictions
    trading_hours:
      avoid_hours: []
      preferred_hours: []
      
    # No volatility filter  
    max_atr_multiplier: 999.0        # Effectively disabled
    volatility_lookback: 14

# DISABLE ALL emergency settings
emergency_global_settings:
  market_suspension:
    "DAX":
      suspend_if_daily_loss_exceeds: 99999999
      suspend_if_win_rate_below: 0
      min_trades_for_suspension: 99999999
    "FTSE 100":
      suspend_if_daily_loss_exceeds: 99999999
      suspend_if_win_rate_below: 0  
      min_trades_for_suspension: 99999999
      
  market_enhancement:
    "FTSE 100":
      increase_frequency_if_profitable: false
      min_profit_for_enhancement: 99999999
    "DAX":
      increase_frequency_if_profitable: false
      min_profit_for_enhancement: 99999999

# Single timeframe only
timeframe_analysis:
  "DAX":
    require_timeframes: ["5M"]
    minimum_aligned_timeframes: 1
    
  "FTSE 100": 
    require_timeframes: ["5M"]
    minimum_aligned_timeframes: 1

# No news filtering
news_sensitivity:
  "DAX":
    avoid_trading_minutes_before_news: 0
    avoid_trading_minutes_after_news: 0
    major_news_events: []
      
  "FTSE 100":
    avoid_trading_minutes_before_news: 0
    avoid_trading_minutes_after_news: 0
    major_news_events: []