# Market-Specific Strategy Configuration
# Based on performance analysis showing DAX losses and FTSE profits

market_strategies:
  "DAX":
    # Simplified parameters for better trade execution
    rsi_period: 14
    rsi_buy_threshold: 35        # Buy on oversold (mean reversion)
    rsi_sell_threshold: 65       # Sell on overbought (mean reversion)
    stop_loss_pips: 8            # Tighter stop for more trades
    take_profit_pips: 12         # Achievable target
    min_confidence_threshold: 0.55 # Lower threshold for more opportunities
    
    # DAX-specific risk management (loosened)
    emergency_protection:
      max_consecutive_losses: 8   # Allow more losses before stopping
      daily_loss_limit: 200       # Higher limit for testing
      cooling_off_hours: 0.5      # Shorter cooling period
      reduce_position_size: 1.0   # Full position size
    
    # Time-based filters (removed for more opportunities)
    trading_hours:
      avoid_hours: []             # Trade all hours
      preferred_hours: []         # No preference
      
    # Volatility filters
    max_atr_multiplier: 1.5      # Don't trade if ATR > 1.5x normal
    volatility_lookback: 20      # Use 20 periods for volatility calc

  "FTSE 100":
    # Adjusted for standard RSI strategy
    rsi_period: 14
    rsi_buy_threshold: 30        # Buy on oversold
    rsi_sell_threshold: 70       # Sell on overbought
    stop_loss_pips: 5            # Tighter stop
    take_profit_pips: 10         # Achievable target
    min_confidence_threshold: 0.5 # Lower threshold
    
    # FTSE-specific optimizations (loosened)
    emergency_protection:
      max_consecutive_losses: 10  # Very lenient
      daily_loss_limit: 300       # Higher limit
      cooling_off_hours: 0.25     # Minimal cooling
      reduce_position_size: 1.0   # Full position size
    
    # Time-based filters (removed for more opportunities)
    trading_hours:
      avoid_hours: []             # Trade all hours
      preferred_hours: []         # No preference
      
    # Volatility filters
    max_atr_multiplier: 2.0      # More lenient (less volatile than DAX)
    volatility_lookback: 14      # Standard lookback

# Global overrides (disabled for testing)
emergency_global_settings:
  # Market suspension disabled
  market_suspension:
    "DAX":
      suspend_if_daily_loss_exceeds: 9999  # Effectively disabled
      suspend_if_win_rate_below: 0         # Never suspend
      min_trades_for_suspension: 999       # Very high threshold
      
  # Enhancement settings
  market_enhancement:
    "FTSE 100":
      increase_frequency_if_profitable: true
      min_profit_for_enhancement: 5         # Lower threshold

# Multi-timeframe confirmation requirements (simplified)
timeframe_analysis:
  "DAX":
    require_timeframes: ["5M"]               # Single timeframe
    minimum_aligned_timeframes: 1            # Just one needed
    
  "FTSE 100": 
    require_timeframes: ["5M"]               # Single timeframe
    minimum_aligned_timeframes: 1            # Just one needed

# News/Event filters (disabled for testing)
news_sensitivity:
  "DAX":
    avoid_trading_minutes_before_news: 0     # No avoidance
    avoid_trading_minutes_after_news: 0      # No avoidance
    major_news_events: []                    # Ignore all news
      
  "FTSE 100":
    avoid_trading_minutes_before_news: 0     # No avoidance
    avoid_trading_minutes_after_news: 0      # No avoidance
    major_news_events: []                    # Ignore all news