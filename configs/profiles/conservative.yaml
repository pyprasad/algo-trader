economic_calendar:
  enabled: true
  high_impact_events:
  - FOMC Meeting
  - Interest Rate Decision
  - ECB Meeting
  - BOE Meeting
  - Non-Farm Payrolls
  - CPI
  - GDP
  - Central Bank Speech
  pause_after_minutes: 180
  pause_before_minutes: 180
emergency_risk:
  daily_loss_limit: 0.02
  extreme_volatility_threshold: 0.03
  high_volatility_threshold: 0.02
  max_consecutive_losses: 3
  max_loss_per_trade: 0.01
  max_position_size: 0.005
  max_total_exposure: 0.02
professional_trading:
  analysis_interval_minutes: 10
  daily_loss_limit: 200
  enabled: true
  max_trades_per_hour: 0.25
  min_signal_confidence: 0.85
  smart_money:
    enabled: true
    min_confidence: 0.8
    require_confluence: true
  system_mode: conservative
  trade_frequency: very_low
profile_info:
  description: Ultra-safe capital preservation with maximum risk controls
  expected_characteristics:
    avg_trade_duration: 4-8 hours
    max_daily_risk: 2%
    trades_per_day: 1-3
    win_rate_target: 70-80%
  name: conservative
  target_audience: Risk-averse traders prioritizing capital protection
sentiment_analysis:
  enabled: true
  min_confidence_threshold: 0.8
  pause_on_uncertainty: true
  respect_negative_sentiment: true
strategy_parameters:
  avoid_news_times: true
  multiple_timeframe_confirmation: true
  stop_loss_multiplier: 0.8
  take_profit_multiplier: 2.0
  trend_confirmation_required: true
